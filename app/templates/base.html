<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}IT Onboarding Generator{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="/" class="logo">⬛ IT Onboarding Generator</a>
      <nav class="header-nav">
        <a href="/generator" class="nav-cta">Generate PDF &rarr;</a>
      </nav>
    </div>
  </header>
  <main class="{% block main_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <div class="container">Built for small business IT teams.</div>
  </footer>
</body>
</html>
