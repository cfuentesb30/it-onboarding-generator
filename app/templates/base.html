<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}IT Onboarding Generator{% endblock %}</title>

  <!-- SEO -->
  <meta name="description" content="Generate a custom IT onboarding checklist PDF in under a minute. Tailored to Windows, macOS, or remote setup — free, no signup required."/>
  <meta name="author" content="Carlos Fuentes"/>

  <!-- Open Graph (LinkedIn, Facebook, Reddit rich previews) -->
  <meta property="og:type"        content="website"/>
  <meta property="og:url"         content="https://it-onboarding-generator.onrender.com/"/>
  <meta property="og:title"       content="IT Onboarding Generator — Custom Checklists in Seconds"/>
  <meta property="og:description" content="Stop setting up new employees from memory. Fill in the form, download a print-ready IT checklist PDF. Free. No account. No friction."/>
  <meta property="og:image"       content="https://it-onboarding-generator.onrender.com/static/og-image.png"/>

  <!-- Twitter / X card -->
  <meta name="twitter:card"        content="summary_large_image"/>
  <meta name="twitter:title"       content="IT Onboarding Generator — Custom Checklists in Seconds"/>
  <meta name="twitter:description" content="Stop setting up new employees from memory. Fill in the form, download a print-ready IT checklist PDF. Free. No account. No friction."/>
  <meta name="twitter:image"       content="https://it-onboarding-generator.onrender.com/static/og-image.png"/>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111'/><text y='.9em' font-size='70' x='15'>📋</text></svg>"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="/" class="logo" data-i18n="nav_brand">⬛ IT Onboarding Generator</a>
      <nav class="header-nav">
        <a href="/about" class="nav-about" data-i18n="nav_about">About</a>
        <div class="lang-switcher" id="lang-switcher">
          <button id="lang-toggle" class="btn-lang" onclick="toggleLangDropdown()" aria-label="Switch language"><img src="https://flagcdn.com/16x12/us.png" width="16" height="12" alt="US flag" class="lang-flag-img"/> EN</button>
          <div class="lang-dropdown" id="lang-dropdown">
            <button class="lang-dropdown-item" onclick="selectLang('en')"><img src="https://flagcdn.com/16x12/us.png" width="16" height="12" alt="US" class="lang-flag-img"/> English</button>
            <button class="lang-dropdown-item" onclick="selectLang('es')"><img src="https://flagcdn.com/16x12/es.png" width="16" height="12" alt="ES" class="lang-flag-img"/> Español</button>
            <button class="lang-dropdown-item" onclick="selectLang('pt')"><img src="https://flagcdn.com/16x12/br.png" width="16" height="12" alt="BR" class="lang-flag-img"/> Português</button>
            <button class="lang-dropdown-item" onclick="selectLang('fr')"><img src="https://flagcdn.com/16x12/fr.png" width="16" height="12" alt="FR" class="lang-flag-img"/> Français</button>
          </div>
        </div>
        <a href="/generator" class="nav-cta" data-i18n="nav_cta">Generate PDF &rarr;</a>
      </nav>
    </div>
  </header>
  <main class="{% block main_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <div class="container footer-inner">
      <p class="footer-tagline" data-i18n="footer_tagline">Free forever &middot; Donation-supported &middot; Built for small business IT teams.</p>
      <div class="footer-links">
        <!-- TODO: Replace href with your Ko-fi URL once account is ready -->
        <a href="https://ko-fi.com/cfuentesb30" target="_blank" rel="noopener" class="footer-kofi-link" data-i18n="footer_support">Support this project</a>
        <span class="footer-sep">&middot;</span>
        <a href="/about" class="footer-link">About</a>
        <span class="footer-sep">&middot;</span>
        <a href="/suggest" class="footer-link" data-i18n="footer_suggest">Suggest a feature</a>
      </div>
    </div>
  </footer>
  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>

  <!-- Language picker — shown only on first visit -->
  <div class="lang-picker-overlay" id="lang-picker-overlay">
    <div class="lang-picker-modal">
      <p class="lang-picker-eyebrow">IT Onboarding Generator</p>
      <h2 class="lang-picker-title">Choose your language</h2>
      <div class="lang-picker-grid">
        <button class="lang-picker-btn" onclick="pickLang('en')">
          <img src="https://flagcdn.com/32x24/us.png" width="32" height="24" alt="US" class="lang-flag-img lang-flag-lg"/>
          <span class="lang-name">English</span>
        </button>
        <button class="lang-picker-btn" onclick="pickLang('es')">
          <img src="https://flagcdn.com/32x24/es.png" width="32" height="24" alt="ES" class="lang-flag-img lang-flag-lg"/>
          <span class="lang-name">Español</span>
        </button>
        <button class="lang-picker-btn" onclick="pickLang('pt')">
          <img src="https://flagcdn.com/32x24/br.png" width="32" height="24" alt="BR" class="lang-flag-img lang-flag-lg"/>
          <span class="lang-name">Português</span>
        </button>
        <button class="lang-picker-btn" onclick="pickLang('fr')">
          <img src="https://flagcdn.com/32x24/fr.png" width="32" height="24" alt="FR" class="lang-flag-img lang-flag-lg"/>
          <span class="lang-name">Français</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    function pickLang(lang) {
      localStorage.setItem('lang', lang);
      document.getElementById('lang-picker-overlay').classList.remove('open');
      if (typeof selectLang === 'function') selectLang(lang);
      else if (typeof applyLang === 'function') applyLang(lang);
    }

    document.addEventListener('DOMContentLoaded', function() {
      if (!localStorage.getItem('lang')) {
        document.getElementById('lang-picker-overlay').classList.add('open');
      }
    });
  </script>
</body>
</html>
