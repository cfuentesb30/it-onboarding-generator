sections:
  - title: "1. Hardware Check"
    items:
      - Inspect machine condition — no visible damage
      - Verify all peripherals are present (mouse, keyboard, monitor, power adapter)
      - Confirm machine powers on and boots correctly
      - Check available storage (minimum 20 GB free)
      - Verify RAM meets role requirements
      - Record device serial number/asset tag in IT asset inventory and link to employee record

  - title: "2. OS Setup"
    items:
      - Run Windows Update — install all pending updates and restart
      - Set computer hostname (format: COMPANYNAME-USERNAME or asset tag)
      - Create or verify local admin account
      - Set up employee standard user account (non-admin)
      - Configure time zone and regional settings
      - Enable Windows Firewall
      - Enable BitLocker drive encryption
      - Enroll device in MDM (Microsoft Intune) and confirm compliance policy applied
      - Configure backup solution (OneDrive Known Folder Move or company backup agent) and verify it is running
      - Disable unnecessary startup programs

  - title: "3. Software Installation"
    items:
      - Install preferred web browser (Chrome / Edge / Firefox)
      - { text: "Install Microsoft Office and activate license", requires_software: [microsoft_office] }
      - { text: "Set up Google Workspace apps (Drive, Docs, Gmail)", requires_software: [google_workspace] }
      - { text: "Install and configure Slack", requires_software: [slack] }
      - { text: "Install and configure Zoom", requires_software: [zoom] }
      - { text: "Install Microsoft Teams", requires_software: [teams] }
      - { text: "Install and configure antivirus — run initial scan", requires_software: [antivirus] }
      - { text: "Install VPN client and verify connection", requires_software: [vpn] }
      - { text: "Install password manager (Bitwarden or 1Password)", requires_software: [password_manager, 1password, lastpass, bitwarden] }

  - title: "4. Network & Security"
    items:
      - Connect to company Wi-Fi or configure wired connection
      - { text: "Connect to VPN and verify access", requires_software: [vpn] }
      - Enable Windows Hello or set strong login PIN
      - Set up 2FA on all company accounts
      - Confirm standard-user account lacks install rights (verified via non-admin group membership)

  - title: "5. Accounts & Access"
    items:
      - Create company email account and verify login
      - Grant access to shared drives and folders (role-appropriate only)
      - Add to relevant distribution lists and groups
      - Set up access to general company collaboration tools (intranet, wiki, shared calendars) — role-specific project management tools are granted separately
      - { text: "Add to Slack workspace and relevant channels", requires_software: [slack] }
      - { text: "Add to Microsoft Teams workspace", requires_software: [teams] }
      - { text: "Set up Google Workspace account and sharing", requires_software: [google_workspace] }
      - { text: "Configure password manager vault and share company credentials", requires_software: [password_manager, 1password, lastpass, bitwarden] }
      - { text: "Add to company-wide Microsoft 365 tenant", requires_software: [microsoft_office] }
      - { text: "Set up shared calendars and conference rooms", requires_size: [medium, large] }

  - title: "6. Final Verification"
    items:
      - Employee can log in with their credentials
      - Email send and receive confirmed
      - All required applications open without errors
      - VPN connection tested (if applicable)
      - Printer access confirmed (if applicable)
      - Backup solution configured and running
      - Employee walkthrough complete — questions answered
      - Sign-off sheet signed by IT and new employee
