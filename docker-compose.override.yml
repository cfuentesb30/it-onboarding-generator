# Development only. Loaded automatically by `docker compose` unless
# COMPOSE_FILE (or -f) is set, which is how production skips it.
#
# Mounts the source code into the container and runs Flask's dev server
# with auto-reload, so code changes show up without rebuilding the image.

services:
  app:
    command: flask --app run run --debug --host 0.0.0.0 --port 10000
    volumes:
      - .:/app
